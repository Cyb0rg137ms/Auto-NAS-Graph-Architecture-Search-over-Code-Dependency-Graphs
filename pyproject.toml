[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonas-graph"
version = "2.0.0"
description = "Measured neural architecture search: tabular benchmark, random/evolution/local search, DARTS, surrogates, AST code miner"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyb0rg137ms" }]
requires-python = ">=3.11"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
autonas = "autonas.cli:main"

[tool.setuptools.packages.find]
include = ["autonas*", "nas_graph*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "B008", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F401", "E501", "E702", "I001", "RUF", "SIM"]
"nas_graph/evaluator.py" = ["UP", "F541", "W291", "W293", "B007", "E501"]
"nas_graph/search.py" = ["UP", "W291", "W293", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=600"
